name: fish-sniper

x-backend-image: &backend-image
  build:
    context: ./backend
    target: development

x-frontend-image: &frontend-image
  build:
    context: ./frontend
    target: development

services:
  backend:
    <<: *backend-image
    init: true
    env_file:
      - ./backend/.env
    environment:
      CORS_ORIGINS: http://localhost:5173
      GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS: http://localhost:5173/auth/google/callback
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    <<: *frontend-image
    init: true
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_GOOGLE_OAUTH_REDIRECT_URI: http://localhost:5173/auth/google/callback
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend-lint:
    <<: *backend-image
    profiles:
      - test
    command:
      - uv
      - run
      - ruff
      - check
      - .

  backend-test:
    <<: *backend-image
    profiles:
      - test
    command:
      - uv
      - run
      - pytest
      - -q

  frontend-build:
    <<: *frontend-image
    profiles:
      - test
    command:
      - npm
      - run
      - build

volumes:
  backend_venv:
  frontend_node_modules:
