[project]
name = "fishsniper-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "python-dotenv==1.1.0",
    "httpx==0.28.1",
    "pyjwt==2.10.1",
    "supabase==2.24.0",
    "websockets>=13.1",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.11.0",
    "langgraph==0.6.6",
    "google-genai==1.38.0",
    "openai==1.82.0",
    "PyYAML==6.0.2",
    "langfuse==3.2.1",
    "slowapi==0.1.9",
    "limits==4.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "ruff==0.11.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: pure unit tests without HTTP",
    "api: in-process FastAPI API tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# `load_dotenv()` must run before application imports that read settings at import-time.
"main.py" = ["E402"]
